<?xml version="1.0" encoding="UTF-8"?>
<!--
  The default mark: an abstract admission ticket, deliberately generic.

  No text, because the site's name comes from SITE_NAME and a logo with a name
  baked into it would be wrong for every adopter but one. No colour beyond
  currentColor, so it takes the surrounding text colour and works on a light or dark
  page without a second file.

  Replace it by putting your own logo.svg in STATIC_DIR — no rebuild needed.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ticket">
  <path d="M3 7a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3a2 2 0 0 0 0 4v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a2 2 0 0 0 0-4V7Z"/>
  <path d="M15 6v2M15 11v2M15 16v2"/>
</svg>
